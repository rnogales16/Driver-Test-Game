<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="game.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <title>Driver Test Game</title>
  </head>
  <body>
    <div class="everything">
      <h1>Driver Test Game</h1>
      <div class="controls-info">
        <p>
          Usa <kbd>A</kbd> y <kbd>D</kbd> para la bola izquierda |
          <kbd>&larr;</kbd> <kbd>&rarr;</kbd> para la derecha |
          <kbd>Space</kbd> para pausar
        </p>
      </div>
      <button id="button">Start Test</button>
      <div class="gameandinfo">
        <canvas id="canvas" width="800" height="500"></canvas>
        <div class="sidebar">
          <div class="info-box">
            <h3>Lives</h3>
            <span id="lives" class="info-value">1000</span>
          </div>
          <div class="info-box">
            <h3>Time</h3>
            <div id="timer" class="info-value">
              <span id="minDec">0</span><span id="minUni">0</span><span class="separator">:</span><span id="secDec">0</span><span id="secUni">0</span>
            </div>
          </div>
          <div class="info-box">
            <h3>Speed</h3>
            <span id="speed" class="info-value">1x</span>
          </div>
          <div class="info-box">
            <h3>High Score</h3>
            <span id="highscore" class="info-value">--</span>
          </div>
        </div>
      </div>

      <div id="gameover-overlay" class="hidden">
        <div class="gameover-box">
          <h2>Game Over!</h2>
          <p>Tiempo: <span id="final-time"></span></p>
          <p>Velocidad alcanzada: <span id="final-speed"></span></p>
          <p id="new-record" class="hidden">Nuevo record!</p>
          <button id="restart-btn">Jugar de nuevo</button>
        </div>
      </div>
    </div>

    <script src="chrono.js"></script>
    <script src="checkOnRoad.js"></script>
    <script src="balls.js"></script>
    <script src="roads.js"></script>
    <script src="index.js"></script>
  </body>
</html>
